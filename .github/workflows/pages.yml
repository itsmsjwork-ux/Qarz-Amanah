name: Deploy Qarz Amanah to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Generate Dua audio (male voice) 
        run: |
          python -m pip install --quiet edge-tts
          python - <<'PY'
          import asyncio
          from pathlib import Path
          import edge_tts

          items = [
            ("dua1.mp3", "اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ", "ar-SA-HamedNeural", "-8%"),
            ("dua2.mp3", "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ، وَغَلَبَةِ الْعَدُوِّ، وَشَمَاتَةِ الْأَعْدَاءِ", "ar-SA-HamedNeural", "-8%"),
            ("dua3.mp3", "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ", "ar-SA-HamedNeural", "-8%"),
            ("dua4.mp3", "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكَسَلِ وَالْهَرَمِ وَالْمَأْثَمِ وَالْمَغْرَمِ", "ar-SA-HamedNeural", "-8%"),
            ("dua1-meaning.mp3", "O Allah, suffice me with what You have made lawful instead of what You have made unlawful, and enrich me by Your grace so that I need none besides You.", "en-IN-PrabhatNeural", "-8%"),
            ("dua2-meaning.mp3", "O Allah, I seek refuge in You from being overcome by debt, from being overcome by the enemy, and from the rejoicing of enemies.", "en-IN-PrabhatNeural", "-8%"),
            ("dua3-meaning.mp3", "O Allah, I seek refuge in You from anxiety and grief, from incapacity and laziness, from cowardice and miserliness, from the burden of debt, and from being overcome by people.", "en-IN-PrabhatNeural", "-8%"),
            ("dua4-meaning.mp3", "O Allah, I seek refuge in You from laziness, old age, sin, and debt.", "en-IN-PrabhatNeural", "-8%"),
          ]

          async def make_audio():
              out = Path("audio")
              out.mkdir(exist_ok=True)
              for filename, text, voice, rate in items:
                  communicate = edge_tts.Communicate(text, voice, rate=rate)
                  await communicate.save(str(out / filename))

          asyncio.run(make_audio())
          PY
      - name: Verify Dua audio assets
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              "dua1.mp3","dua2.mp3","dua3.mp3","dua4.mp3",
              "dua1-meaning.mp3","dua2-meaning.mp3","dua3-meaning.mp3","dua4-meaning.mp3",
          ]
          audio_dir=Path("audio")
          missing=[]
          for name in required:
              p=audio_dir/name
              if not p.exists() or p.stat().st_size < 1024:
                  missing.append(f"{name} (missing or too small)")
          print("Generated audio files:")
          for p in sorted(audio_dir.glob("*.mp3")):
              print(f" - {p} {p.stat().st_size} bytes")
          if missing:
              raise SystemExit("Audio verification failed: " + ", ".join(missing))
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
